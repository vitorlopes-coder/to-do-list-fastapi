[project]
name = "to-do-list"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vitor Lopes", email = "vcoder00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
